<!doctype html><html lang="nl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7efe5"><title>Homey</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css">
</head><body><div class="app">
<main id="home" class="screen active">
  <img class="screen-img" src="homey-house.png" alt="Homey huis">
  <div class="live-stats"><b id="points">0</b><b id="coins">0</b><b><span id="balls">0</span>/15</b></div>
  <button class="room r-bed" data-room="Slaapkamer"></button><button class="room r-bath" data-room="Badkamer"></button><button class="room r-living" data-room="Woonkamer"></button><button class="room r-kitchen" data-room="Keuken"></button><button class="room r-hall" data-room="Hal"></button><button class="room r-laundry" data-room="Wasruimte"></button><button class="room r-terrace" data-room="Terras"></button>
  <div class="home-nav"><button data-go="home"></button><button data-go="shop"></button><button data-go="inventory"></button><button data-go="levels"></button><button data-go="more"></button></div>
</main>
<main id="shop" class="screen">
  <div class="shop-viewport"><img class="shop-img" src="homey-shop.png" alt="Homey Winkeltje"></div>
  <div class="shop-nav">
    <button data-go="home"><img src="nav-home.png" alt="Mijn huis"></button>
    <button data-go="shop" class="selected"><img src="nav-shop.png" alt="Winkeltje"></button>
    <button data-go="inventory"><img src="nav-inventory.png" alt="Inventaris"></button>
    <button data-go="levels"><img src="nav-levels.png" alt="Levels"></button>
    <button data-go="more"><img src="nav-more.png" alt="Meer"></button>
  </div>
</main>
<section id="placeholder" class="placeholder" hidden><button class="back" data-go="home">←</button><h2 id="placeholderTitle"></h2><p>Dit scherm bouwen we hierna in dezelfde Homey-stijl.</p></section>
<section id="panel" class="panel" hidden><div class="card"><button id="close">×</button><h2 id="roomTitle"></h2><p>Tik een taak aan wanneer je ze hebt voltooid.</p><div id="tasks"></div></div></section>
<div id="toast" class="toast"></div>
</div><script src="app.js"></script></body></html>
