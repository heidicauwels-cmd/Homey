<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7efe5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Homey</title>
</head>
<body>
  <div class="app-shell">
    <main class="screen">
      <img class="homey-reference" src="homey-house.png" alt="Homey huis">

      <div class="live-stats" aria-label="Homey voortgang">
        <div class="live-stat"><span class="star">★</span><b id="livePoints">0</b></div>
        <div class="live-stat"><span class="coin">●</span><b id="liveCoins">0</b></div>
        <div class="live-stat"><span class="ball">●</span><b><span id="liveBalls">0</span>/15</b></div>
      </div>
      <div class="live-balls" id="liveBallRow"></div>

      <button class="hotspot room bedroom" data-room="Slaapkamer" aria-label="Slaapkamer"></button>
      <button class="hotspot room bathroom" data-room="Badkamer" aria-label="Badkamer"></button>
      <button class="hotspot room living" data-room="Woonkamer" aria-label="Woonkamer"></button>
      <button class="hotspot room kitchen" data-room="Keuken" aria-label="Keuken"></button>
      <button class="hotspot room hall" data-room="Hal" aria-label="Hal"></button>
      <button class="hotspot room laundry" data-room="Wasruimte" aria-label="Wasruimte"></button>
      <button class="hotspot room terrace" data-room="Terras" aria-label="Terras"></button>

      <button class="hotspot nav nav-home" data-action="home" aria-label="Mijn huis"></button>
      <button class="hotspot nav nav-shop" data-action="shop" aria-label="Winkeltje"></button>
      <button class="hotspot nav nav-inventory" data-action="inventory" aria-label="Inventaris"></button>
      <button class="hotspot nav nav-levels" data-action="levels" aria-label="Levels"></button>
      <button class="hotspot nav nav-more" data-action="more" aria-label="Meer"></button>

      <button class="hotspot side tasks" data-action="tasks" aria-label="Taken"></button>
      <button class="hotspot side photos" data-action="photos" aria-label="Foto's"></button>
      <button class="hotspot side daily" data-action="daily" aria-label="Dagelijkse taken"></button>
      <button class="hotspot side bonus" data-action="bonus" aria-label="Bonus"></button>
      <button class="hotspot side coins" data-action="coins" aria-label="Munten"></button>

      <section class="panel" id="panel" hidden>
        <div class="panel-card">
          <button id="closePanel" class="close">×</button>
          <div id="panelIcon" class="panel-icon">🏡</div>
          <h2 id="panelTitle">Homey</h2>
          <p id="panelText"></p>
          <div id="taskList"></div>
        </div>
      </section>

      <div id="toast" class="toast" role="status"></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
