<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Homey</title>
</head>
<body>
<div class="phone">
  <main id="homeScreen" class="screen active">
    <img class="home-img" src="homey-house.png" alt="Mijn huis">
    <button class="hit room bedroom" data-room="Slaapkamer"></button>
    <button class="hit room bathroom" data-room="Badkamer"></button>
    <button class="hit room living" data-room="Woonkamer"></button>
    <button class="hit room kitchen" data-room="Keuken"></button>
    <button class="hit room hall" data-room="Hal"></button>
    <button class="hit room laundry" data-room="Wasruimte"></button>
    <button class="hit room terrace" data-room="Terras"></button>
    <button class="hit nav n-home" data-nav="home"></button>
    <button class="hit nav n-shop" data-nav="shop"></button>
    <button class="hit nav n-inventory" data-nav="inventory"></button>
    <button class="hit nav n-levels" data-nav="levels"></button>
    <button class="hit nav n-more" data-nav="more"></button>
  </main>

  <main id="shopScreen" class="screen shop-screen">
    <div class="shop-top"><img src="shop-top.jpg" alt="Homey"></div>
    <div class="shop-scroll"><img src="shop-middle.jpg" alt="Winkeltje"></div>
    <div class="shop-bottom">
      <img src="shop-bottom.jpg" alt="Navigatie">
      <button class="hit bnav bh" data-nav="home"></button>
      <button class="hit bnav bs" data-nav="shop"></button>
      <button class="hit bnav bi" data-nav="inventory"></button>
      <button class="hit bnav bl" data-nav="levels"></button>
      <button class="hit bnav bm" data-nav="more"></button>
    </div>
  </main>

  <section id="simpleScreen" class="simple-screen" hidden>
    <div class="simple-card">
      <div id="simpleIcon">🎒</div>
      <h2 id="simpleTitle">Inventaris</h2>
      <p id="simpleText"></p>
    </div>
  </section>

  <section class="panel" id="panel" hidden>
    <div class="panel-card">
      <button id="closePanel" class="close">×</button>
      <div id="panelIcon" class="panel-icon">🏡</div>
      <h2 id="panelTitle">Homey</h2>
      <p id="panelText"></p>
      <div id="taskList"></div>
    </div>
  </section>
  <div id="toast" class="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
