<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8ee">
<title>Homey</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- VASTE BASIS: dit is exact het goedgekeurde Homey-huis -->
  <main id="home" class="screen active home-screen">
    <img class="home-art" src="home-base.png" alt="Homey huis">

    <!-- Alleen de dynamische waarden liggen bovenop de vaste basis -->
    <div class="live coin-value" id="homeCoins">0</div>
    <div class="live point-value" id="homePoints">0</div>
    <div class="live today-value"><span id="homeBalls">0</span>/15</div>

    <div class="ball-row" id="homeBallRow"></div>

    <div class="live bonus-value"><span id="homeBonusCount">0</span>/15</div>
    <div class="bonus-check" id="bonusCheck">✓</div>

    <div class="room-value rv-bedroom" data-home-room="Slaapkamer">0/3</div>
    <div class="room-value rv-bathroom" data-home-room="Badkamer">0/4</div>
    <div class="room-value rv-living" data-home-room="Woonkamer">0/6</div>
    <div class="room-value rv-kitchen" data-home-room="Keuken">0/5</div>
    <div class="room-value rv-hall" data-home-room="Hal">0/3</div>
    <div class="room-value rv-laundry" data-home-room="Wasruimte">0/3</div>
    <div class="room-value rv-terrace" data-home-room="Terras">0/3</div>

    <!-- klikzones: huis -> kameroverzicht -->
    <button class="hotspot hs-bedroom" data-overview="Slaapkamer" aria-label="Slaapkamer"></button>
    <button class="hotspot hs-bathroom" data-overview="Badkamer" aria-label="Badkamer"></button>
    <button class="hotspot hs-living" data-overview="Woonkamer" aria-label="Woonkamer"></button>
    <button class="hotspot hs-kitchen" data-overview="Keuken" aria-label="Keuken"></button>
    <button class="hotspot hs-hall" data-overview="Hal" aria-label="Hal"></button>
    <button class="hotspot hs-laundry" data-overview="Wasruimte" aria-label="Wasruimte"></button>
    <button class="hotspot hs-terrace" data-overview="Terras" aria-label="Terras"></button>

    <!-- navigatieklikzones op de vaste onderste balk -->
    <button class="nav-hit nh-home" data-go="home" aria-label="Mijn huis"></button>
    <button class="nav-hit nh-shop" data-go="shop" aria-label="Winkeltje"></button>
    <button class="nav-hit nh-inventory" data-go="inventory" aria-label="Inventaris"></button>
    <button class="nav-hit nh-levels" data-go="levels" aria-label="Levels"></button>
    <button class="nav-hit nh-more" data-go="more" aria-label="Meer"></button>
  </main>

  <!-- Scherm 2: kameroverzicht -->
  <section id="overview" class="panel" hidden>
    <header class="panel-head">
      <button class="back" data-go="home">←</button>
      <div>
        <div class="leaf-title">🌿 Kamers 🌿</div>
        <div class="mini-stats">
          <span>⭐ <b id="ovPoints">0</b></span>
          <span>🪙 <b id="ovCoins">0</b></span>
          <span>🔵 <b id="ovBalls">0</b>/15</span>
        </div>
      </div>
    </header>
    <div id="roomCards" class="room-cards"></div>
    <nav class="bottom-nav">
      <button data-go="home"><img src="nav-home.png"><span>Mijn huis</span></button>
      <button data-go="shop"><img src="nav-shop.png"><span>Winkeltje</span></button>
      <button data-go="inventory"><img src="nav-inventory.png"><span>Inventaris</span></button>
      <button data-go="levels"><img src="nav-levels.png"><span>Levels</span></button>
      <button data-go="more"><img src="nav-more.png"><span>Meer</span></button>
    </nav>
  </section>

  <!-- Scherm 3: taken -->
  <section id="roomScreen" class="panel" hidden>
    <header class="panel-head">
      <button class="back" id="roomBack">←</button>
      <div>
        <div class="leaf-title" id="roomTitle">🌿 Woonkamer 🌿</div>
        <div class="mini-stats">
          <span>⭐ <b id="taskPoints">0</b></span>
          <span>🪙 <b id="taskCoins">0</b></span>
          <span>🔵 <b id="taskBalls">0</b>/15</span>
        </div>
      </div>
    </header>
    <div class="room-progress">
      <div><b id="taskProgressText">0 van 6 taken klaar</b><b id="taskPct">0%</b></div>
      <div class="traffic" id="trafficBar"></div>
    </div>
    <div class="tasks" id="tasks"></div>
    <nav class="bottom-nav">
      <button data-go="home"><img src="nav-home.png"><span>Mijn huis</span></button>
      <button data-go="shop"><img src="nav-shop.png"><span>Winkeltje</span></button>
      <button data-go="inventory"><img src="nav-inventory.png"><span>Inventaris</span></button>
      <button data-go="levels"><img src="nav-levels.png"><span>Levels</span></button>
      <button data-go="more"><img src="nav-more.png"><span>Meer</span></button>
    </nav>
  </section>

  <main id="shop" class="screen shop-screen" hidden>
    <img src="homey-shop.png" alt="Homey Winkeltje">
    <button class="shop-back" data-go="home" aria-label="Terug"></button>
  </main>

  <section id="placeholder" class="placeholder" hidden>
    <button class="back" data-go="home">←</button>
    <h2 id="placeholderTitle"></h2>
    <p>Dit scherm bouwen we verder vanuit dezelfde vaste Homey-basis.</p>
  </section>

  <div id="toast" class="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
