<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7efe5"><title>Homey</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><div class="app">
<main id="home" class="screen active"><img class="screen-img" src="homey-house.png" alt="Homey huis"><div class="live-stats"><b id="points">0</b><b id="coins">0</b><b><span id="balls">0</span>/15</b></div><button class="room r-bed" data-room="Slaapkamer"></button><button class="room r-bath" data-room="Badkamer"></button><button class="room r-living" data-room="Woonkamer"></button><button class="room r-kitchen" data-room="Keuken"></button><button class="room r-hall" data-room="Hal"></button><button class="room r-laundry" data-room="Wasruimte"></button><button class="room r-terrace" data-room="Terras"></button><div class="home-nav"><button data-go="home"></button><button data-go="shop"></button><button data-go="inventory"></button><button data-go="levels"></button><button data-go="more"></button></div></main>
<main id="shop" class="screen"><div class="shop-viewport"><img class="shop-img" src="homey-shop.png" alt="Homey Winkeltje"></div><div class="shop-nav"><button data-go="home"><img src="nav-home.png"></button><button data-go="shop" class="selected"><img src="nav-shop.png"></button><button data-go="inventory"><img src="nav-inventory.png"></button><button data-go="levels"><img src="nav-levels.png"></button><button data-go="more"><img src="nav-more.png"></button></div></main>
<section id="placeholder" class="placeholder" hidden><button class="back" data-go="home">←</button><h2 id="placeholderTitle"></h2><p>Dit scherm bouwen we hierna in dezelfde Homey-stijl.</p></section>
<main id="roomScreen" class="room-screen" hidden><header class="room-head"><button id="roomBack" class="round-back">←</button><div class="room-title-wrap"><div class="room-icon" id="roomIcon">🛋️</div><div class="script-title"><span>🌿</span><h1 id="roomTitle"></h1><span>🌿</span></div></div></header>
<div class="room-stats"><div><span>⭐</span><b id="roomPoints">0</b><small>punten</small></div><div><span>🪙</span><b id="roomCoins">0</b><small>munten</small></div><div><span class="blue-dot"></span><b><i id="roomBalls">0</i>/15</b><small>bollen vandaag</small></div></div>
<div class="bonusline"><div id="ballTrack"></div><p><span id="ballsToBonus">15</span> bollen tot bonus! <strong>+15 punten</strong> 🎁</p></div><div id="tasks" class="tasks"></div><div class="room-bottom"><span>🔵 <b id="bottomBalls">0</b>/15 bollen vandaag</span><span>15 bollen = bonus<br><strong>+15 punten</strong> 🎁</span></div><div class="task-nav"><button data-go="home">🏠<small>Mijn huis</small></button><button data-go="shop">🧺<small>Winkeltje</small></button><button data-go="inventory">🎒<small>Inventaris</small></button><button data-go="levels">⭐<small>Levels</small></button><button data-go="more">•••<small>Meer</small></button></div></main><div id="toast" class="toast"></div></div><script src="app.js"></script></body></html>
