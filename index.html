<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f0e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Homey</title>
</head>
<body>
<div class="app-shell">
  <main id="homeScreen" class="screen active">
    <img class="reference" src="homey-house.png" alt="Homey huis">
    <div class="live-stats home-live">
      <b id="livePoints">0</b><b id="liveCoins">0</b><b><span id="liveBalls">0</span>/15</b>
    </div>
    <button class="hotspot room bedroom" data-room="Slaapkamer"></button>
    <button class="hotspot room bathroom" data-room="Badkamer"></button>
    <button class="hotspot room living" data-room="Woonkamer"></button>
    <button class="hotspot room kitchen" data-room="Keuken"></button>
    <button class="hotspot room hall" data-room="Hal"></button>
    <button class="hotspot room laundry" data-room="Wasruimte"></button>
    <button class="hotspot room terrace" data-room="Terras"></button>
    <button class="hotspot nav nav-home" data-nav="home"></button>
    <button class="hotspot nav nav-shop" data-nav="shop"></button>
    <button class="hotspot nav nav-inventory" data-nav="inventory"></button>
    <button class="hotspot nav nav-levels" data-nav="levels"></button>
    <button class="hotspot nav nav-more" data-nav="more"></button>
  </main>

  <main id="shopScreen" class="screen shop-screen">
    <img class="reference" src="homey-shop.png" alt="Homey winkeltje">
    <button class="hotspot shop-nav shop-home" data-nav="home"></button>
    <button class="hotspot shop-nav shop-shop" data-nav="shop"></button>
    <button class="hotspot shop-nav shop-inventory" data-nav="inventory"></button>
    <button class="hotspot shop-nav shop-levels" data-nav="levels"></button>
    <button class="hotspot shop-nav shop-more" data-nav="more"></button>
    <button class="hotspot buy buy-green" data-buy="green-sofa" aria-label="Groene bank kopen"></button>
    <button class="hotspot buy buy-chair" data-buy="boho-chair" aria-label="Boho fauteuil kopen"></button>
    <button class="hotspot buy buy-love" data-buy="rattan-love" aria-label="Rotan loveseat kopen"></button>
    <button class="hotspot buy buy-round" data-buy="round-table" aria-label="Ronde salontafel kopen"></button>
    <button class="hotspot buy buy-light" data-buy="light-table" aria-label="Lichte salontafel kopen"></button>
    <button class="hotspot buy buy-side" data-buy="rattan-side" aria-label="Rotan bijzettafel kopen"></button>
    <button class="hotspot buy buy-dresser" data-buy="dresser" aria-label="Houten dressoir kopen"></button>
    <button class="hotspot buy buy-vintage" data-buy="vintage-cab" aria-label="Vintage kastje kopen"></button>
  </main>

  <section id="simpleScreen" class="simple-screen" hidden>
    <button class="simple-back" data-nav="home">‹</button>
    <div class="simple-card"><div id="simpleIcon">🎒</div><h2 id="simpleTitle">Inventaris</h2><p id="simpleText"></p></div>
  </section>

  <section class="panel" id="panel" hidden>
    <div class="panel-card"><button id="closePanel" class="close">×</button><div id="panelIcon" class="panel-icon">🏡</div><h2 id="panelTitle">Homey</h2><p id="panelText"></p><div id="taskList"></div></div>
  </section>
  <div id="toast" class="toast"></div>
</div>
<script src="app.js"></script>
</body>
</html>
