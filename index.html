<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf2e5">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Homey</title>
</head>
<body>
<div class="homey-app">
  <header class="fixed-top">
    <img src="homey-fixed-top.jpg" alt="Homey">
  </header>

  <main id="contentViewport" class="content-viewport">
    <div id="screenContent" class="screen-content">
      <!-- Alle scherminhoud komt voortaan alleen hier. -->
    </div>
  </main>

  <nav class="fixed-bottom">
    <img src="homey-fixed-bottom.jpg" alt="Homey navigatie">
    <button class="nav-hit home" data-nav="home" aria-label="Mijn huis"></button>
    <button class="nav-hit shop" data-nav="shop" aria-label="Winkeltje"></button>
    <button class="nav-hit inventory" data-nav="inventory" aria-label="Inventaris"></button>
    <button class="nav-hit levels" data-nav="levels" aria-label="Levels"></button>
    <button class="nav-hit more" data-nav="more" aria-label="Meer"></button>
  </nav>
</div>
<script>
const viewport = document.getElementById('screenContent');
document.querySelectorAll('[data-nav]').forEach(btn => {
  btn.addEventListener('click', () => {
    const names = {home:'Mijn huis',shop:'Winkeltje',inventory:'Inventaris',levels:'Levels',more:'Meer'};
    viewport.innerHTML = `<div class="placeholder"><h2>${names[btn.dataset.nav]}</h2><p>Dit scherm bouwen we in dit vaste Homey-frame.</p></div>`;
  });
});
</script>
</body>
</html>
